services:
  postgres:
    image: postgres:16-alpine
    container_name: queuejump-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: queuejump
      POSTGRES_PASSWORD: queuejump_dev
      POSTGRES_DB: queuejump
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuejump"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: queuejump-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
  redis_data:
